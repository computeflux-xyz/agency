<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Schematic of many requests collapsing into a few cohorts, then fanning out into the slots of one assembled message">
  <!--
    Card cover. Purely visual: no title text, no numbers, no axis. The site
    renders it at aspect-[16/10] with object-cover, hence the 1200x750 frame.
    Palette and motifs are the site's own (services/site/src/styles/global.css):
    sand canvas, dot-grid backdrop, near-black ink, warm hairlines and the
    flux-blue accent.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bdb7a8"/>
    </pattern>
    <marker id="tipBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6bff"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#f5f4ef"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <g transform="translate(0 30)">
    <!-- Left: individual requests. Many, small, undifferentiated. -->
    <g fill="#201f1e">
      <circle cx="112" cy="248" r="8"/>
      <circle cx="112" cy="316" r="8"/>
      <circle cx="112" cy="384" r="8"/>
      <circle cx="112" cy="452" r="8"/>
      <circle cx="112" cy="520" r="8"/>
    </g>

    <!-- Collapse: five requests into three cohorts. Detail is dropped on
         purpose, which is the whole privacy argument drawn as a shape. -->
    <g stroke="#bdb7a8" stroke-width="2" fill="none">
      <path d="M124 248 C 220 248, 250 282, 336 282"/>
      <path d="M124 316 C 220 316, 250 282, 336 282"/>
      <path d="M124 384 C 220 384, 250 384, 336 384"/>
      <path d="M124 452 C 220 452, 250 486, 336 486"/>
      <path d="M124 520 C 220 520, 250 486, 336 486"/>
    </g>

    <!-- Middle: the cohorts. -->
    <g fill="none" stroke="#201f1e" stroke-width="2.5">
      <rect x="336" y="252" width="176" height="60" rx="8"/>
      <rect x="336" y="354" width="176" height="60" rx="8"/>
      <rect x="336" y="456" width="176" height="60" rx="8"/>
    </g>

    <path d="M528 384 H628" fill="none" stroke="#2f6bff" stroke-width="6" marker-end="url(#tipBlue)"/>

    <!-- Right: one message, assembled from slots filled per recipient. The
         hero slot is the filled one. -->
    <rect x="650" y="212" width="454" height="344" rx="12" fill="none" stroke="#201f1e" stroke-width="2.5"/>
    <rect x="686" y="248" width="382" height="112" rx="8" fill="#2f6bff" fill-opacity="0.18" stroke="#2f6bff" stroke-width="2.5"/>
    <g fill="none" stroke="#201f1e" stroke-width="2" opacity="0.75">
      <rect x="686" y="386" width="116" height="76" rx="6"/>
      <rect x="819" y="386" width="116" height="76" rx="6"/>
      <rect x="952" y="386" width="116" height="76" rx="6"/>
      <rect x="686" y="486" width="382" height="34" rx="6"/>
    </g>

    <!-- Hairline rules, the site's "technical sheet" motif. -->
    <g stroke="#dcd7cb" stroke-width="1.5">
      <path d="M96 128 H1104"/>
      <path d="M96 640 H1104"/>
    </g>
    <rect x="96" y="122" width="52" height="6" rx="3" fill="#2f6bff"/>
  </g>
</svg>
