<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Schematic of a payment state machine with an asynchronous callback returning to an earlier state">
  <!--
    Card cover. Purely visual: no title text, no numbers, no axis. The site
    renders it at aspect-[16/10] with object-cover, hence the 1200x750 frame.
    Palette and motifs are the site's own (services/site/src/styles/global.css):
    sand canvas, dot-grid backdrop, near-black ink, warm hairlines and the
    flux-blue accent.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bdb7a8"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#201f1e"/>
    </marker>
    <marker id="tipBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6bff"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#f5f4ef"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <g transform="translate(0 40)">
    <!-- The forward path: four states, chained. -->
    <g fill="none" stroke="#201f1e" stroke-width="2.5">
      <rect x="96"  y="345" width="188" height="80" rx="8"/>
      <rect x="380" y="345" width="188" height="80" rx="8"/>
      <rect x="664" y="345" width="188" height="80" rx="8"/>
    </g>
    <rect x="948" y="345" width="188" height="80" rx="8" fill="#2f6bff" fill-opacity="0.16" stroke="#2f6bff" stroke-width="2.5"/>

    <g stroke="#201f1e" stroke-width="2.5" fill="none" marker-end="url(#tip)">
      <path d="M284 385 H372"/>
      <path d="M568 385 H656"/>
      <path d="M852 385 H940"/>
    </g>

    <!-- The asynchronous callback: the edge that can be lost, so it is the one
         drawn dashed, in the accent, and looping backwards. -->
    <path d="M1042 337 C 1042 196, 474 196, 474 337"
          fill="none" stroke="#2f6bff" stroke-width="3" stroke-dasharray="10 8"
          marker-end="url(#tipBlue)"/>

    <!-- Reconciliation: the slow sweep that catches what the callback dropped. -->
    <path d="M1042 433 C 1042 560, 190 560, 190 433"
          fill="none" stroke="#201f1e" stroke-width="2" stroke-dasharray="3 7"
          opacity="0.45" marker-end="url(#tip)"/>

    <!-- Hairline rules, the site's "technical sheet" motif. -->
    <g stroke="#dcd7cb" stroke-width="1.5">
      <path d="M96 128 H1136"/>
      <path d="M96 642 H1136"/>
    </g>
    <g fill="#2f6bff">
      <rect x="96" y="122" width="52" height="6" rx="3"/>
    </g>
  </g>
</svg>
