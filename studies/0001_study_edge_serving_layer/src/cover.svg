<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Schematic of a relational source of truth published as a denormalised snapshot">
  <!--
    Card cover. Purely visual: no title text, no numbers, no axis. The site
    renders it at aspect-[16/10] with object-cover, hence the 1200x750 frame.
    Palette and motifs are the site's own (services/site/src/styles/global.css):
    sand canvas, dot-grid backdrop, near-black ink, warm hairlines and the
    flux-blue accent.
  -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bdb7a8"/>
    </pattern>
    <marker id="tipBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6bff"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#f5f4ef"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <g transform="translate(0 30)">
    <!-- Left: the relational source of truth. One connected graph. -->
    <rect x="96" y="270" width="356" height="230" rx="12" fill="none" stroke="#201f1e" stroke-width="2.5"/>
    <g stroke="#201f1e" stroke-width="2.2">
      <path d="M180 360 H274 M274 360 H368 M274 360 V430"/>
    </g>
    <g fill="#201f1e">
      <circle cx="180" cy="360" r="10"/>
      <circle cx="274" cy="360" r="10"/>
      <circle cx="368" cy="360" r="10"/>
      <circle cx="274" cy="430" r="10"/>
    </g>

    <!-- Right: the published snapshot. Same information, denormalised into
         independent keys, so the edges are faint rather than structural. -->
    <rect x="748" y="270" width="356" height="230" rx="12" fill="none" stroke="#201f1e" stroke-width="2.5"/>
    <g stroke="#bdb7a8" stroke-width="1.6" stroke-dasharray="5 5">
      <path d="M830 348 L878 442 M926 348 L878 442 M926 348 L1022 442 M1022 348 L1022 442"/>
    </g>
    <g fill="#2f6bff">
      <circle cx="830" cy="348" r="9"/>
      <circle cx="926" cy="348" r="9"/>
      <circle cx="1022" cy="348" r="9"/>
      <circle cx="878" cy="442" r="9"/>
      <circle cx="1022" cy="442" r="9"/>
    </g>

    <!-- The single publish edge. One explicit action, not a trigger per row. -->
    <path d="M460 385 H738" fill="none" stroke="#2f6bff" stroke-width="6" marker-end="url(#tipBlue)"/>

    <!-- Hairline rules, the site's "technical sheet" motif. -->
    <g stroke="#dcd7cb" stroke-width="1.5">
      <path d="M96 150 H1104"/>
      <path d="M96 620 H1104"/>
    </g>
    <rect x="96" y="144" width="52" height="6" rx="3" fill="#2f6bff"/>
  </g>
</svg>
