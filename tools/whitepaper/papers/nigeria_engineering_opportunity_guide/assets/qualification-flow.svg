<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="491px" preserveAspectRatio="none" style="width:795px;height:491px;background:#F5F4EF;" version="1.1" viewBox="0 0 795 491" width="795px" zoomAndPan="magnify"><defs/><g><rect fill="#F5F4EF" height="491" style="stroke:none;stroke-width:1;" width="795" x="0" y="0"/><!--entity symptom--><g class="entity" data-entity="symptom" data-source-line="25" data-uid="ent0002" id="entity_symptom"><rect fill="#FFFFFF" height="43.3105" style="stroke:#201F1E;stroke-width:1;" width="286.7939" x="104.71" y="7"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="258.7939" x="118.71" y="33.5684">XclusiveCloud hears a concrete symptom</text></g><!--entity brief--><g class="entity" data-entity="brief" data-source-line="26" data-uid="ent0003" id="entity_brief"><rect fill="#FFFFFF" height="43.3105" style="stroke:#201F1E;stroke-width:1;" width="367.8218" x="64.2" y="81.31"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="339.8218" x="78.2" y="107.8784">Record impact, scale, environment, history and owner</text></g><!--entity evidence--><g class="entity" data-entity="evidence" data-source-line="27" data-uid="ent0004" id="entity_evidence"><rect fill="#FDE7FB" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="170.9395" x="162.64" y="155.62"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="99.4614" x="198.379" y="182.1884">EVIDENCE GATE</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="142.9395" x="176.64" y="194.5985">Is enough evidence available?</text></g><!--entity collect--><g class="entity" data-entity="collect" data-source-line="28" data-uid="ent0005" id="entity_collect"><rect fill="#FFFFFF" height="43.3105" style="stroke:#201F