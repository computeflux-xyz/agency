" textLength="210.3867" x="564.91" y="468.6784">Explain missing fit and stop early</text></g><!--link symptom to brief--><g class="link" data-entity-1="symptom" data-entity-2="brief" data-source-line="34" data-uid="lnk10" id="link_symptom_brief"><path d="M248.11,50.57 C248.11,60.08 248.11,65.31 248.11,74.85" fill="none" id="symptom-to-brief" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="248.11,80.85,252.11,71.85,248.11,75.85,244.11,71.85,248.11,80.85" style="stroke:#575247;stroke-width:1;"/></g><!--link brief to evidence--><g class="link" data-entity-1="brief" data-entity-2="evidence" data-source-line="35" data-uid="lnk11" id="link_brief_evidence"><path d="M248.11,124.92 C248.11,134.24 248.11,139.33 248.11,149.25" fill="none" id="brief-to-evidence" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="248.11,155.25,252.11,146.25,248.11,150.25,244.11,146.25,248.11,155.25" style="stroke:#575247;stroke-width:1;"/></g><!--link evidence to conversation--><g class="link" data-entity-1="evidence" data-entity-2="conversation" data-source-line="36" data-uid="lnk12" id="link_evidence_conversation"><path d="M323.07,211.13 C366.95,226.91 415.9141,244.5294 456.6741,259.1894" fill="none" id="evidence-to-conversation" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="462.32,261.22,455.2049,254.4101,457.6151,259.5278,452.4973,261.938,462.32,261.22" style="stroke:#575247;stroke-width:1;"/><text fill="#797263" font-family="JetBrains Mono" font-size="10" lengthAdjust="spacing" textLength="15.8936" x="422.09" y="240.378">yes</text></g><!--link evidence to collect--><g class="link" data-entity-1="evidence" data-entity-2="collect" data-source-line="37" data-uid="lnk13" id="link_evidence_collect"><path d="M182.67,211.14 C177.75,215.36 173.42,220.19 170.11,225.71 C163.77,236.26 163.0561,244.1015 165.0561,255.4215" fill="none" id="evidence-to-collect" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="166