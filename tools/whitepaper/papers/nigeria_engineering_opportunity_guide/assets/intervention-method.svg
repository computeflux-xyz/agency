<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="473px" preserveAspectRatio="none" style="width:410px;height:473px;background:#F5F4EF;" version="1.1" viewBox="0 0 410 473" width="410px" zoomAndPan="magnify"><defs/><g><rect fill="#F5F4EF" height="473" style="stroke:none;stroke-width:1;" width="410" x="0" y="0"/><!--entity problem--><g class="entity" data-entity="problem" data-source-line="26" data-uid="ent0002" id="entity_problem"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="267.9268" x="118.01" y="7"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="82.8242" x="210.5613" y="33.5684">01  PROBLEM</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="239.9268" x="132.01" y="45.9785">Define failed business outcome and consequence</text></g><!--entity assessment--><g class="entity" data-entity="assessment" data-source-line="27" data-uid="ent0003" id="entity_assessment"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="305.4072" x="99.27" y="88.09"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="104.7554" x="199.5959" y="114.6584">02  ASSESSMENT</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="277.4072" x="113.27" y="127.0685">Collect evidence, baseline system, test competing causes</text></g><!--entity decision--><g class="entity" data-entity="decision" data-source-line="28" data-uid="ent0004" id="entity_decision"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="272.3652" x="29.79" y="169.18"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="173.2021" x="79.3715" y="195.7484">03  ENGINEERING DECISION</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="244.3652" x="43.79" y="208.1585">Select smallest intervention that can change result</text></g><!--entity implementation--><g class="entity" data-entity="implementation" data-source-line="29" data-uid="ent0005" id="entity_implementation"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="246.4326" x="36.76" y="250.27"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="137.4775" x="91.2375" y="276.8384">04  IMPLEMENTATION</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="218.4326" x="50.76" y="289.2485">Build, test, migrate and release progressively</text></g><!--entity measurement--><g class="entity" data-entity="measurement" data-source-line="30" data-uid="ent0006" id="entity_measurement"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="297.9463" x="7" y="331.35"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="119.2217" x="96.3623" y="357.9184">05  MEASUREMENT</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="269.9463" x="21" y="370.3285">Compare same journey under representative conditions</text></g><!--entity outcome--><g class="entity" data-entity="outcome" data-source-line="31" data-uid="ent0007" id="entity_outcome"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="250.2266" x="123.86" y="412.44"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="89.3306" x="204.308" y="439.0084">06  OUTCOME</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="222.2266" x="137.86" y="451.4185">Adopt, iterate, roll back or stop with evidence</text></g><!--link problem to assessment--><g class="link" data-entity-1="problem" data-entity-2="assessment" data-source-line="33" data-uid="lnk8" id="link_problem_assessment"><path d="M251.97,62.32 C251.97,70.48 251.97,73.45 251.97,81.62" fill="none" id="problem-to-assessment" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="251.97,87.62,255.97,78.62,251.97,82.62,247.97,78.62,251.97,87.62" style="stroke:#575247;stroke-width:1;"/></g><!--link assessment to decision--><g class="link" data-entity-1="assessment" data-entity-2="decision" data-source-line="34" data-uid="lnk9" id="link_assessment_decision"><path d="M222.86,143.41 C213.99,151.57 208.6553,156.4673 199.7653,164.6473" fill="none" id="assessment-to-decision" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="195.35,168.71,204.6814,165.5595,199.0294,165.3244,199.2645,159.6725,195.35,168.71" style="stroke:#575247;stroke-width:1;"/></g><!--link decision to implementation--><g class="link" data-entity-1="decision" data-entity-2="implementation" data-source-line="35" data-uid="lnk10" id="link_decision_implementation"><path d="M163.94,224.5 C163.32,232.65 163.094,235.6372 162.474,243.8072" fill="none" id="decision-to-implementation" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="162.02,249.79,166.6896,241.1185,162.3983,244.8043,158.7125,240.5131,162.02,249.79" style="stroke:#575247;stroke-width:1;"/></g><!--link implementation to measurement--><g class="link" data-entity-1="implementation" data-entity-2="measurement" data-source-line="36" data-uid="lnk11" id="link_implementation_measurement"><path d="M158.62,305.59 C158.21,313.74 158.0507,316.7175 157.6407,324.8875" fill="none" id="implementation-to-measurement" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="157.34,330.88,161.7861,322.0918,157.5906,325.8863,153.7961,321.6908,157.34,330.88" style="stroke:#575247;stroke-width:1;"/></g><!--link measurement to outcome--><g class="link" data-entity-1="measurement" 