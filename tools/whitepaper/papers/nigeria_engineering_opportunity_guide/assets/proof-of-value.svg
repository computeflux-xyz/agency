<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="612px" preserveAspectRatio="none" style="width:620px;height:612px;background:#F5F4EF;" version="1.1" viewBox="0 0 620 612" width="620px" zoomAndPan="magnify"><defs/><g><rect fill="#F5F4EF" height="612" style="stroke:none;stroke-width:1;" width="620" x="0" y="0"/><!--entity qualified--><g class="entity" data-entity="qualified" data-source-line="25" data-uid="ent0002" id="entity_qualified"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="237.4922" x="280.88" y="7"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="135.002" x="332.1251" y="33.5684">Qualified opportunity</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="209.4922" x="294.88" y="45.9785">one problem, one owner, existing evidence</text></g><!--entity day1--><g class="entity" data-entity="day1" data-source-line="26" data-uid="ent0003" id="entity_day1"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="248.0879" x="275.58" y="91.09"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="158.9961" x="320.1259" y="117.6584">ENGINEER-DAY 1: FRAME</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="220.0879" x="289.58" y="130.0685">workshop, system map, baseline, hypotheses</text></g><!--entity day2--><g class="entity" data-entity="day2" data-source-line="27" data-uid="ent0004" id="entity_day2"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="263.1855" x="268.03" y="175.18"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="232.6099" x="283.3178" y="201.7484">ENGINEER-DAY 2: TEST AND REPORT</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="235.1855" x="282.03" y="214.1585">focused analysis, readout and short written note</text></g><!--entity readout--><g class="entity" data-entity="readout" data-source-line="28" data-uid="ent0005" id="entity_readout"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="257.0283" x="271.11" y="259.27"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="115.5718" x="341.8383" y="285.8384">Diagnostic finding</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="229.0283" x="285.11" y="298.2485">likely cause, confidence, risk, missing evidence</text></g><!--entity decision--><g class="entity" data-entity="decision" data-source-line="29" data-uid="ent0006" id="entity_decision"><rect fill="#FDE7FB" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="199.2256" x="300.01" y="343.36"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="97.7158" x="350.7649" y="369.9284">DECISION GATE</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="171.2256" x="314.01" y="382.3385">Is a bounded intervention justified?</text></g><!--entity pov--><g class="entity" data-entity="pov" data-source-line="30" data-uid="ent0007" id="entity_pov"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="260.2412" x="178.5" y="447.44"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="118.6377" x="249.3018" y="474.0084">Paid proof of value</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="232.2412" x="192.5" y="486.4185">baseline, small change, measurement, stop rule</text></g><!--entity stop--><g class="entity" data-entity="stop" data-source-line="31" data-uid="ent0008" id="entity_stop"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="247.9609" x="366.64" y="551.53"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="156.3174" x="412.4618" y="578.0984">Instrument, refer or stop</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="219.9609" x="380.64" y="590.5085">no project manufactured from weak evidence</text></g><!--entity larger--><g class="entity" data-entity="larger" data-source-line="32" data-uid="ent0009" id="entity_larger"><rect fill="#FFFFFF" height="55.0879" style="stroke:#201F1E;stroke-width:1;" width="333.249" x="7" y="551.53"/><text fill="#201F1E" font-family="Space Grotesk" font-size="13" lengthAdjust="spacing" textLength="122.4653" x="112.3918" y="578.0984">Larger engagement</text><text fill="#797263" font-family="Space Grotesk" font-size="10" lengthAdjust="spacing" textLength="305.249" x="21" y="590.5085">implement, verify and transfer after proof supports investment</text></g><!--link qualified to day1--><g class="link" data-entity-1="qualified" data-entity-2="day1" data-source-line="34" data-uid="lnk10" id="link_qualified_day1"><path d="M399.62,62.43 C399.62,71.5 399.62,75.62 399.62,84.7" fill="none" id="qualified-to-day1" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="399.62,90.7,403.62,81.7,399.62,85.7,395.62,81.7,399.62,90.7" style="stroke:#575247;stroke-width:1;"/></g><!--link day1 to day2--><g class="link" data-entity-1="day1" data-entity-2="day2" data-source-line="35" data-uid="lnk11" id="link_day1_day2"><path d="M399.62,146.52 C399.62,155.59 399.62,159.71 399.62,168.79" fill="none" id="day1-to-day2" style="stroke:#575247;stroke-width:1;"/><polygon fill="#575247" points="399.62,174.79,403.62,165.79,399.62,169.79,395.62,165.79,399.62,174.79" style="stroke:#575247;stroke-width:1;"/></g><!--link day2 to readout--><g class="link" data-entity-1